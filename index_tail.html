<!-- Firebase + noticias index -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/load-news-index.js"></script>
<script src="js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  feather.replace();
  document.querySelectorAll('[data-ripple]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect(), size = Math.max(rect.width, rect.height) * 2;
      const r = document.createElement('span'); r.classList.add('ripple');
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      this.appendChild(r); setTimeout(() => r.remove(), 700);
    });
  });
  const statObs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target, numEl = el.querySelector('.stat-number');
      if (!numEl) return;
      const target = parseInt(numEl.textContent.replace(/[^0-9]/g, ''), 10);
      if (!target) return;
      const duration = 1400, start = performance.now();
      function easeOut(t){return t===1?1:1-Math.pow(2,-10*t);}
      function tick(now){
        const p = Math.min((now-start)/duration, 1);
        numEl.innerHTML = numEl.innerHTML.replace(/\d+/, Math.round(easeOut(p)*target));
        if(p<1) requestAnimationFrame(tick); else el.classList.add('counted');
      }
      requestAnimationFrame(tick); statObs.unobserve(el);
    });
  }, {threshold:.4});
  document.querySelectorAll('.stat-item').forEach(el => statObs.observe(el));
});
</script>
</body>
</html>
